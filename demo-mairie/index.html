<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="description" content="Maquette de tableau de bord pour une mairie, par Optimeo Agency.">
<title>Mairie Connect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Concept : menu latéral sombre sur bureau, barre d'onglets sur mobile. Cartes blanches sur fond vert-gris froid, accent vert sapin, statuts bleu / ambre / vert. */
:root{
  --bg:#EBF2F1; --surface:#FFFFFF; --surface-2:#F3F8F7; --ink:#0B2A2D; --ink-2:#44605D; --ink-3:#5E7678;
  --line:#D9E5E3; --accent:#0A7A68; --accent-ink:#FFFFFF; --accent-soft:#D6EFE9; --sun:#E9A62B; --sun-soft:#FFF0CF;
  --prog:#2D6BDB; --prog-soft:#DCE8FC; --wait:#B26D00; --wait-soft:#FCE9C6; --done:#17794B; --done-soft:#D3EFE1; --urgent:#C93A35; --urgent-soft:#FADDDB;
  --side:#0B2A2D; --side-ink:#BFD8D4; --side-line:#1B4247; --frame:#0B2A2D;
  --map-land:#E4EFE8; --map-block:#D2E3DA; --map-water:#BFDCEC; --map-road:#FFFFFF; --map-ink:#46635F;
  --shadow:0 1px 2px rgba(11,42,45,.05),0 8px 24px rgba(11,42,45,.06);
  --r:16px;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071A1C; --surface:#0E2A2D; --surface-2:#133236; --ink:#E5F1EF; --ink-2:#A3BDBA; --ink-3:#86A19E;
  --line:#1F4145; --accent:#3CCFB4; --accent-ink:#04201B; --accent-soft:#12403A; --sun:#F2B94B; --sun-soft:#4A3510;
  --prog:#7BA9FF; --prog-soft:#17325F; --wait:#F2B54E; --wait-soft:#473210; --done:#58D79D; --done-soft:#0F402B; --urgent:#FF8079; --urgent-soft:#4A1C1A;
  --side:#04100F; --side-ink:#A9C7C3; --side-line:#14302E; --frame:#2C4D51;
  --map-land:#112F31; --map-block:#173B3C; --map-water:#173F5A; --map-road:#2A4C50; --map-ink:#8FB0AC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071A1C; --surface:#0E2A2D; --surface-2:#133236; --ink:#E5F1EF; --ink-2:#A3BDBA; --ink-3:#86A19E;
  --line:#1F4145; --accent:#3CCFB4; --accent-ink:#04201B; --accent-soft:#12403A; --sun:#F2B94B; --sun-soft:#4A3510;
  --prog:#7BA9FF; --prog-soft:#17325F; --wait:#F2B54E; --wait-soft:#473210; --done:#58D79D; --done-soft:#0F402B; --urgent:#FF8079; --urgent-soft:#4A1C1A;
  --side:#04100F; --side-ink:#A9C7C3; --side-line:#14302E; --frame:#2C4D51;
  --map-land:#112F31; --map-block:#173B3C; --map-water:#173F5A; --map-road:#2A4C50; --map-ink:#8FB0AC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Structure */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:20px;padding:22px 16px;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#12A38B,#0A6B5C);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:18px;color:#fff;line-height:1.15}
.brand small{display:block;color:var(--side-ink);font-size:12.5px;opacity:.85}
.tri{display:flex;height:3px;border-radius:3px;overflow:hidden;margin:0 6px}
.tri i{flex:1}.tri i:nth-child(1){background:#3157B8}.tri i:nth-child(2){background:#F2F5F5}.tri i:nth-child(3){background:#D8403B}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--side-ink);font-weight:600;text-align:left;width:100%;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.11);color:#fff}
.nav .bdg{margin-left:auto;background:var(--sun);color:#2A1D00;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px;min-width:24px;text-align:center}
.side .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#7FA19D;padding:0 12px}
.side-foot{margin-top:auto;border:1px solid var(--side-line);border-radius:14px;padding:14px;font-size:13px;line-height:1.45}
.side-foot b{color:#fff;display:block;font-family:var(--f-display);font-size:14px}
.side-foot .tel{font-family:var(--f-mono);color:#fff;font-size:13px;margin-top:6px;display:block}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .mini{display:none;align-items:center;gap:10px;min-width:0}
.top .mini .logo{width:36px;height:36px;border-radius:11px}
.commune{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
.commune b{font-family:var(--f-display);font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.commune small{color:var(--ink-3);font-size:12px}
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px 10px 40px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.sp{flex:1}
.ibtn{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ibtn .dot{position:absolute;top:-5px;right:-5px;background:var(--urgent);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.me{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-weight:600;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex:none;font-family:var(--f-body)}
.page{padding-block:8px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));width:100%;max-width:1360px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:10px 0 20px}
.vh h1{font-size:32px;line-height:1.1;font-weight:800}
.vh p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:none}

/* Grille de cartes */
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{font-size:17px}
.ch .sub{color:var(--ink-3);font-size:13px}
.link{color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
@media (max-width:1180px){.s3,.s4{grid-column:span 6}.s5,.s7,.s8{grid-column:span 12}}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding-left:var(--gl);padding-right:var(--gr)}
  .top .mini{display:flex}.search,.me #meName{display:none}.me{padding:4px}
  .page{padding-left:var(--gl);padding-right:var(--gr);padding-bottom:110px}
  .vh h1{font-size:26px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 2px;border-radius:12px;position:relative}
  .tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .tabs .bdg{position:absolute;top:2px;left:calc(50% + 6px);background:var(--urgent);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
}
@media (max-width:640px){.s3,.s4,.s6{grid-column:span 12}.kp{grid-column:span 6!important}.card{padding:16px}}

/* Composants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{background:var(--done-soft);color:var(--done);border-color:transparent}
.btn.no{background:var(--urgent-soft);color:var(--urgent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 20px;font-size:15px;border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-attente{background:var(--wait-soft);color:var(--wait)}
.p-en_cours{background:var(--prog-soft);color:var(--prog)}
.p-termine{background:var(--done-soft);color:var(--done)}
.p-urgent{background:var(--urgent-soft);color:var(--urgent)}
.p-neutre{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.p-neutre::before{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.new{background:var(--sun);color:#2A1D00;border-radius:6px;font-size:11px;font-weight:800;padding:1px 7px;letter-spacing:.03em;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip b{font-weight:700;background:var(--surface-2);border-radius:99px;padding:0 8px;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] b{background:rgba(255,255,255,.18);color:inherit}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* Bandeau d'accueil */
.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:26px 28px;background:linear-gradient(120deg,#0A2528 0%,#0D4642 55%,#12705F 100%);min-height:168px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero h2{font-size:30px;font-weight:800;line-height:1.12;max-width:20ch;color:#fff}
.hero p{max-width:52ch;color:#CFE6E2;font-size:15.5px}
.hero .date{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8EC9BE;font-weight:700}
.hero .acts{position:relative;z-index:1}
.hero .btn{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff}
.hero .btn.pri{background:#fff;color:#0A2E2B;border-color:#fff}
.hero svg.sky{position:absolute;right:-10px;bottom:-4px;height:150%;max-height:250px;opacity:.9;pointer-events:none}
.hero > *:not(svg){position:relative;z-index:1}

/* Indicateurs */
.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .top2{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink-2);font-weight:600;font-size:14px}
.kic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.t-wait{background:var(--wait-soft);color:var(--wait)}.t-prog{background:var(--prog-soft);color:var(--prog)}.t-done{background:var(--done-soft);color:var(--done)}.t-acc{background:var(--accent-soft);color:var(--accent)}.t-urg{background:var(--urgent-soft);color:var(--urgent)}
.kpi .big{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .big small{font-size:17px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.kpi .dl{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.good{color:var(--done);font-weight:700}.bad{color:var(--urgent);font-weight:700}

/* Graphiques */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--ink-3)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.donut .cen{font-family:var(--f-display);font-weight:800;font-size:26px;fill:var(--ink)}
.donut .cs{font-size:10px;fill:var(--ink-3)}
.dl-list{display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.dl-list div{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.dl-list b{font-variant-numeric:tabular-nums}

/* Listes de demandes */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 18px;gap:14px;align-items:center;padding:13px 6px;border-top:1px solid var(--line);text-align:left;width:100%;border-radius:10px;transition:background .15s}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.row .tt{font-weight:600;line-height:1.3;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .mt{font-size:13px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .chev{color:var(--ink-3)}
.row .mob{display:none}
@media (max-width:700px){.row{grid-template-columns:40px minmax(0,1fr) 18px}.row .svc,.row .pl{display:none}.row .mob{display:inline-flex}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools .search{max-width:340px;min-width:200px}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.view-sw{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.view-sw button{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.view-sw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.kan{grid-template-columns:minmax(0,1fr)}}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.kcol h4{font-size:15px;display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%;box-shadow:0 1px 2px rgba(11,42,45,.04);transition:transform .15s,border-color .15s}
.kcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.kcard b{font-weight:600;line-height:1.3}
.kcard .mt{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:14px}

/* Carte de la commune */
.map{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
.m-land{fill:var(--map-land)}.m-block{fill:var(--map-block)}.m-water{fill:var(--map-water)}
.m-road{fill:none;stroke:var(--map-road);stroke-linecap:round;stroke-linejoin:round}
.m-lbl{font-size:9.5px;fill:var(--map-ink);font-family:var(--f-body);font-weight:600;letter-spacing:.02em}
.m-pin{cursor:pointer}
.m-pin .halo{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){.m-pin .halo{animation:none;opacity:.25}*{transition:none!important}}

/* Avis */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-size:46px;font-weight:800;line-height:1}
.stars{display:inline-flex;gap:2px;color:var(--sun)}
.stars .ic{fill:currentColor;stroke:currentColor;width:16px;height:16px}
.stars .off{color:var(--line)}
.dist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.dist div{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.dist .bar{height:7px}.dist .bar i{background:var(--sun)}
.quote{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--ink-2);line-height:1.45}

/* Échéances */
.ev{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dt{width:48px;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:5px 0;flex:none}
.ev .dt b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.1}
.ev .dt small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ev b{font-weight:600;display:block;line-height:1.3}.ev span{font-size:13px;color:var(--ink-3)}

/* Services */
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.svc-card{text-align:left;display:flex;flex-direction:column;gap:14px;transition:transform .15s,border-color .15s;width:100%}
.svc-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.svc-top{display:flex;gap:12px;align-items:center}
.svc-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.svc-top b{font-family:var(--f-display);font-size:17px;line-height:1.2;display:block}
.svc-top span{font-size:13px;color:var(--ink-3)}
.stack{display:flex}.stack .av{margin-left:-8px;border:2px solid var(--surface);width:30px;height:30px;font-size:11.5px}.stack .av:first-child{margin-left:0}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-stats div{background:var(--surface-2);border-radius:11px;padding:9px 10px}
.mini-stats b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.mini-stats span{font-size:12px;color:var(--ink-3)}
.dot-s{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* Agents */
.acard{display:flex;flex-direction:column;gap:12px}
.ahead{display:flex;gap:12px;align-items:center}
.ahead .av{width:42px;height:42px;font-size:14px}
.ahead b{display:block;line-height:1.2}.ahead span{font-size:13px;color:var(--ink-3)}
.ahead .pill{margin-left:auto}
.adet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.adet div{background:var(--surface-2);border-radius:11px;padding:8px 10px}
.adet small{display:block;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.adet span{font-weight:600;font-size:14px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.gt{min-width:860px;display:grid;grid-template-columns:150px repeat(35,minmax(19px,1fr))}
.gt > *{border-top:1px solid var(--line);min-height:34px}
.gt .h{border-top:0;font-size:10.5px;text-align:center;color:var(--ink-3);padding:6px 0;line-height:1.2}
.gt .h.we,.gt .c.we{background:var(--surface-2)}
.gt .h.td{color:var(--accent);font-weight:800}
.gt .nm{padding:6px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line)}
.gt .c{border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.gt .b{margin:6px 1px;border-radius:7px;font-size:11px;font-weight:700;padding:0 7px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;z-index:1}
.b-attente{background:repeating-linear-gradient(135deg,var(--wait-soft) 0 6px,color-mix(in srgb,var(--wait-soft) 55%,var(--surface)) 6px 12px);color:var(--wait);border:1px dashed var(--wait)}
.b-en_cours{background:var(--prog-soft);color:var(--prog)}
.b-termine{background:var(--done-soft);color:var(--done)}
.gt .tdl{grid-row:1/-1;border-left:2px solid var(--accent);z-index:1;pointer-events:none;border-top:0;min-height:0}
.gt .c.td{background:var(--accent-soft)}

/* Panneau latéral */
.ovl{position:fixed;inset:0;background:rgba(4,18,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--surface);z-index:61;transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.drw.on{transform:none}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 14px 22px;border-bottom:1px solid var(--line)}
.dh h3{font-size:20px;line-height:1.2;margin-top:6px}
.db{padding:18px max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:20px}
.sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:10px;font-family:var(--f-body);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kv small{display:block;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kv span{font-weight:600;overflow-wrap:anywhere}
.msg{background:var(--surface-2);border-radius:14px;padding:14px;line-height:1.55}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:14px}
.segs button{padding:10px 6px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.segs button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.segs button[data-s="attente"][aria-pressed="true"]{color:var(--wait)}
.segs button[data-s="en_cours"][aria-pressed="true"]{color:var(--prog)}
.segs button[data-s="termine"][aria-pressed="true"]{color:var(--done)}
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--accent-soft);margin-top:4px;box-sizing:content-box;width:8px;height:8px}
.tl b{font-weight:600;display:block;line-height:1.35}.tl small{color:var(--ink-3);font-size:12.5px}
.nitem{display:grid;grid-template-columns:40px minmax(0,1fr) 10px;gap:12px;align-items:start;padding:12px;border-radius:14px;text-align:left;width:100%;transition:background .15s}
.nitem:hover{background:var(--surface-2)}
.nitem.un{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.nitem .ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.nitem b{font-weight:600;line-height:1.35;display:block}.nitem small{color:var(--ink-3);font-size:12.5px}
.nitem .ud{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:8px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:6px 4px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{transform:translateX(18px)}

/* Alerte */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--surface);padding:13px 18px;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);max-width:min(92vw,520px);font-weight:600;font-size:14.5px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ic{color:var(--accent);flex:none}
.toast button{margin-left:6px;color:var(--accent);font-weight:700;white-space:nowrap}
@media (max-width:899px){.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}

/* Portail citoyen */
.portal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:40px;align-items:start}
@media (max-width:1000px){.portal{grid-template-columns:minmax(0,1fr)}}
.steps{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.steps div{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start}
.steps .kic{width:42px;height:42px}
.steps b{display:block;font-weight:700;margin-bottom:2px}
.steps p{color:var(--ink-2);font-size:14.5px}
.urlbox{margin-top:20px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:12px 14px;font-weight:600;overflow-wrap:anywhere}
.phone{border:10px solid var(--frame);border-radius:44px;background:var(--surface);overflow:hidden;box-shadow:0 30px 60px -20px rgba(11,42,45,.45);width:100%;max-width:440px;margin-inline:auto}
.ph-top{background:linear-gradient(135deg,#0A2F2C,#0F5C50);color:#fff;padding:26px 22px 22px}
.ph-top small{display:block;letter-spacing:.09em;text-transform:uppercase;font-size:11px;color:#9ED7CB;font-weight:700}
.ph-top h3{font-size:23px;margin:4px 0 6px;color:#fff}
.ph-top p{font-size:14px;color:#CBE7E2}
.ph-body{padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-weight:700;font-size:13.5px}
.fld input[type=text],.fld input[type=email],.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:12px 13px;min-width:0}
.fld textarea{min-height:104px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld .err{color:var(--urgent);font-size:12.5px;font-weight:600;display:none}
.fld.bad .err{display:block}.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--urgent)}
.tsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tsel button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-weight:700;font-size:13.5px;text-align:left}
.tsel button .ic{color:var(--accent)}
.tsel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.starin{display:flex;gap:4px}
.starin button{color:var(--line);padding:2px}
.starin button .ic{width:34px;height:34px;fill:currentColor;stroke:currentColor}
.starin button.on{color:var(--sun)}
.upl{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:13px;padding:12px;background:var(--surface-2);font-size:14px;color:var(--ink-2);cursor:pointer}
.upl img{width:46px;height:46px;border-radius:10px;object-fit:cover}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.done-box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 4px}
.done-box .okc{width:72px;height:72px;border-radius:50%;background:var(--done-soft);color:var(--done);display:grid;place-items:center}
.done-box .okc .ic{width:36px;height:36px;stroke-width:2.4}
.ref{font-family:var(--f-mono);font-size:18px;background:var(--surface-2);border-radius:12px;padding:8px 16px;letter-spacing:.05em}
@media (max-width:640px){.phone{border:0;border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}}
.note-demo{margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--sun-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note-demo .ic{color:var(--wait);margin-top:2px}
.att{display:flex;flex-direction:column;gap:10px}
.attr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);text-align:left;width:100%}
.attr .ri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.attr b{font-weight:600;line-height:1.3;display:block}.attr small{color:var(--ink-3);font-size:12.5px}
@media (max-width:640px){.attr{grid-template-columns:40px minmax(0,1fr)}.attr .pill{display:none}}
.pers .fld{margin-bottom:14px}


.ld{display:grid;grid-template-columns:34px minmax(0,1fr) 28px;gap:12px;align-items:center;padding:8px 0;text-align:left;width:100%;border-radius:10px}
.ld:hover .ldm b{color:var(--accent)}
.ldm{display:flex;flex-direction:column;gap:6px;min-width:0}
.ldm b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld .svc-ic{width:34px;height:34px;border-radius:10px}
.svc-card{cursor:pointer}
.ld > b{text-align:right}
@media (max-width:640px){.hero{padding:22px 20px}.hero h2{font-size:26px}.hero svg.sky{opacity:.55}.vh{margin-top:4px}.tools .search{max-width:none;flex:1 1 100%}}
</style>
</head>

    <div class="card s5"><div class="ch"><div><h3>À traiter en priorité</h3><span class="sub">Urgences et demandes qui traînent</span></div><button class="link" data-a="go" data-v="dem">Tout voir ${ic('chev','xs')}</button></div>

/* ----- Demandes des habitants ----- */
function demFiltered(statusToo){
  const q=S.dem.q.trim().toLowerCase();
  return CITOYENS.filter(r=>(!statusToo||S.dem.f==='tous'||r.statut===S.dem.f)&&(S.dem.s==='tous'||r.svc===S.dem.s)&&(!q||(r.titre+' '+r.nom+' '+r.lieu+' '+r.id+' '+r.msg).toLowerCase().includes(q)))
   .sort((a,b)=>(b.nouveau?1:0)-(a.nouveau?1:0)||D(b.ts)-D(a.ts))}
function demBody(){
  const m=S.dem.mode;
  if(m==='colonnes'){const rows=demFiltered(false),cols=S.dem.f==='tous'?ORDER:[S.dem.f];
    return `<div class="kan" style="${cols.length<3?'grid-template-columns:minmax(0,1fr)':''}">${cols.map(s=>{const l=rows.filter(r=>r.statut===s);return `<div class="kcol"><h4><span>${pill(s)}</span><span class="faint">${l.length}</span></h4>${l.map(cardDem).join('')||'<div class="empty">Aucune demande</div>'}</div>`}).join('')}</div>`}
  const rows=demFiltered(true);
  if(m==='carte'){const loc=rows.filter(r=>r.x!=null);
    return `<div class="g"><div class="card s7">${mapSvg(loc)}</div><div class="card s5"><div class="ch"><div><h3>${loc.length} ${pl(loc.length,'signalement localisé','signalements localisés')}</h3><span class="sub">Les demandes sans adresse précise n'apparaissent pas sur la carte</span></div></div><div class="list">${loc.map(rowDem).join('')||'<div class="empty">Aucun résultat</div>'}</div></div></div>`}
  return `<div class="card" style="padding:8px 14px"><div class="list">${rows.map(rowDem).join('')||'<div class="empty">Aucune demande ne correspond à votre recherche.</div>'}</div></div>`}
function vDem(){
  const f=S.dem.f,c=s=>s==='tous'?CITOYENS.length:CITOYENS.filter(r=>r.statut===s).length;
  const sw=[['liste','list','Liste'],['colonnes','cols','Colonnes'],['carte','map','Carte']];

   <select id="dsvc" aria-label="Filtrer par service"><option value="tous">Tous les services</option>${SERVICES.map(s=>`<option value="${s.id}" ${S.dem.s===s.id?'selected':''}>${esc(s.nom)}</option>`).join('')}</select>
   <div class="view-sw" role="group" aria-label="Affichage">${sw.map(([k,i,l])=>`<button data-a="dmode" data-m="${k}" aria-pressed="${S.dem.mode===k}">${ic(i,'sm')}${l}</button>`).join('')}</div></div>
  <div id="dbody">${demBody()}</div>`}

/* ----- Demandes des agents ----- */
const dayIdx=s=>Math.round((D(s)-D('2026-10-19'))/864e5);
function conflit(a){
  if(!a.debut||a.jours<1)return null;const sv=agent(a.agent).svc;
  const o=DEM_AGENTS.find(b=>b.id!==a.id&&b.debut&&b.jours>=1&&b.issue!=='refuse'&&b.statut!=='termine'&&agent(b.agent).svc===sv&&b.debut<=a.fin&&a.debut<=b.fin);
  return o?agent(o.agent).nom:null}
function cardAg(a){
  const g=agent(a.agent),cf=a.statut==='attente'?conflit(a):null;
  const per=a.debut?(a.debut===a.fin?fmtD(a.debut):`${fmtD(a.debut)} au ${fmtD(a.fin)}`):'Sans date';
  const st=a.statut==='termine'&&a.issue==='refuse'?'<span class="pill p-urgent">Refusée</span>':a.statut==='termine'?'<span class="pill p-termine">Terminée</span>':pill(a.statut);
  const acts=a.statut==='attente'?`<button class="btn ok sm" data-a="agok" data-id="${a.id}">${ic('check','sm')}Accepter</button><button class="btn no sm" data-a="agno" data-id="${a.id}">${ic('x','sm')}Refuser</button>`:a.statut==='en_cours'?`<button class="btn sm" data-a="agdone" data-id="${a.id}">${ic('check','sm')}Marquer comme terminée</button>`:`<span class="faint" style="font-size:13px">${a.issue==='refuse'?'Refusée':'Acceptée'} le ${fmtD(a.ts)}</span>`;
  return `<div class="card acard"><div class="ahead">${avH(g)}<div><b>${esc(g.nom)}</b><span>${esc(g.poste)}</span></div>${st}</div>
  <div class="adet"><div><small>Type</small><span>${esc(a.type)}</span></div><div><small>Période</small><span>${per}</span></div><div><small>${/Congés/.test(a.type)?'Solde':'Durée'}</small><span>${/Congés/.test(a.type)?g.solde+' j':a.jours?a.jours+' j':'—'}</span></div></div>
  <p class="muted" style="font-size:14px">${esc(a.detail)}</p>
  ${cf?`<div class="pill p-attente" style="white-space:normal;align-self:flex-start">${ic('alert','xs')} Chevauche l'absence de ${esc(cf)} (même service)</div>`:''}
  <div class="acts" style="align-items:center">${acts}<span class="faint mono" style="margin-left:auto">${a.id}</span></div></div>`}
function gantt(){
  const N=35,rows=AGENTS.map(g=>({g,its:DEM_AGENTS.filter(a=>a.agent===g.id&&a.debut&&a.jours>=1&&a.issue!=='refuse'&&dayIdx(a.fin)>=0&&dayIdx(a.debut)<N)})).filter(r=>r.its.length);
  let h=`<div class="h" style="grid-row:1;grid-column:1"></div>`;
  for(let i=0;i<N;i++){const dt=new Date(D('2026-10-19').getTime()+i*864e5),we=i%7>=5;h+=`<div class="h${we?' we':''}${i===3?' td':''}" style="grid-row:1;grid-column:${i+2}">${'LMMJVSD'[i%7]}<br>${dt.getDate()}</div>`}
  rows.forEach((r,ri)=>{const row=ri+2;h+=`<div class="nm" style="grid-row:${row};grid-column:1">${esc(r.g.nom)}</div>`;for(let i=0;i<N;i++)h+=`<div class="c${i%7>=5?' we':''}${i===3?' td':''}" style="grid-row:${row};grid-column:${i+2}"></div>`;
    r.its.forEach(a=>{const s=Math.max(dayIdx(a.debut),0),e=Math.min(dayIdx(a.fin),N-1);h+=`<div class="b b-${a.statut}" style="grid-row:${row};grid-column:${s+2}/${e+3}" title="${esc(a.type)}">${esc(a.type.split(' ')[0])}</div>`})});
  return `<div class="gantt"><div class="gt">${h}</div></div>`}
function vAgents(){
  const f=S.ag.f,c=s=>s==='tous'?DEM_AGENTS.length:DEM_AGENTS.filter(r=>r.statut===s).length;
  const list=DEM_AGENTS.filter(a=>f==='tous'||a.statut===f).sort((a,b)=>D(b.ts)-D(a.ts));
  const decided=DEM_AGENTS.filter(a=>a.statut!=='attente').length,abs=DEM_AGENTS.filter(a=>a.debut&&a.jours>=1&&a.issue!=='refuse'&&dayIdx(a.debut)>=3&&dayIdx(a.debut)<=33).length;
  return `<div class="vh"><div><h1>Demandes des agents</h1><p>Congés, formations, matériel, heures supplémentaires : chaque agent dépose sa demande depuis son téléphone, vous la validez en un geste.</p></div><div class="acts"><button class="btn pri" data-a="simag">${ic('plus','sm')}Simuler une demande d'agent</button></div></div>
  <div class="g">
   ${kpi('kp s4','clock','t-wait','À valider',nAttAg(),'','Les agents sont prévenus de votre réponse')}
   ${kpi('kp s4','check','t-done','Décisions prises',decided,'','Acceptées, refusées ou terminées')}

  </div>
  <div class="tools" style="margin-top:20px"><div class="chips">${[...ORDER,'tous'].map(s=>`<button class="chip" data-a="afil" data-s="${s}" aria-pressed="${f===s}">${s==='tous'?'Toutes':SL[s]}<b>${c(s)}</b></button>`).join('')}</div></div>
  <div class="agrid">${list.map(cardAg).join('')||'<div class="empty card">Aucune demande dans cette catégorie.</div>'}</div>
  <div class="card" style="margin-top:20px"><div class="ch"><div><h3>Planning des absences</h3><span class="sub">5 semaines. Les demandes en attente sont hachurées.</span></div><div class="legend"><span><i style="background:var(--wait-soft);border:1px dashed var(--wait)"></i>En attente</span><span><i style="background:var(--prog-soft)"></i>Acceptée</span></div></div>${gantt()}</div>`}

  else if(t.id==='d-svc'){const r=CITOYENS.find(x=>x.id===S.drawer.id),s=svc(t.value);r.svc=s.id;r.agent=s.resp;r.tl.push([now(),'Transmise à : '+s.nom]);S.drawer.keep=1;render();toast('Demande transmise à '+s.nom)}
  else if(t.id==='f-photo'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{S.form.photo=fr.result;render()};fr.readAsDataURL(t.files[0])}
});
document.addEventListener('submit',e=>{if(e.target.id==='cform'){e.preventDefault();submitForm()}});
function themeIcon(){const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);$('#themeBtn').innerHTML=ic(dark?'sun':'moon')}
(function init(){
  try{const t=localStorage.getItem('mc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  themeIcon();render();
})();
</script>
</body>
